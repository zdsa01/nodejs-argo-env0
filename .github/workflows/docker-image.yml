apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-argo
  labels:
    app: nodejs-argo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs-argo
  template:
    metadata:
      labels:
        app: nodejs-argo
    spec:
      containers:
      - name: nodejs-argo
        image: YOUR_ECR_OR_REGISTRY/nodejs-argo:latest   # <-- 替换为你的镜像
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        - name: FILE_PATH
          value: "/tmp/.npm"
        - name: UUID
          valueFrom:
            secretKeyRef:
              name: nodejs-argo-secrets
              key: uuid
              optional: true
        - name: ARGO_DOMAIN
          valueFrom:
            configMapKeyRef:
              name: nodejs-argo-config
              key: argo_domain
              optional: true
        - name: ARGO_AUTH
          valueFrom:
            secretKeyRef:
              name: nodejs-argo-secrets
              key: argo_auth
              optional: true
        - name: CFIP
          valueFrom:
            configMapKeyRef:
              name: nodejs-argo-config
              key: cfip
              optional: true
        - name: CFPORT
          valueFrom:
            configMapKeyRef:
              name: nodejs-argo-config
              key: cfport
              optional: true
        - name: NAME
          valueFrom:
            configMapKeyRef:
              name: nodejs-argo-config
              key: name_prefix
              optional: true
        - name: SUB_PATH
          value: "sub"
        - name: SHOW_LOG
          value: "true"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 20
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-argo
spec:
  selector:
    app: nodejs-argo
  ports:
  - port: 80
    targetPort: 3000
    name: http
  type: ClusterIP
---
