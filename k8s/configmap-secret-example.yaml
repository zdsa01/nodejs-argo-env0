# 示例 ConfigMap 和 Secret（部署前请根据实际值修改并应用）
apiVersion: v1
kind: ConfigMap
metadata:
  name: nodejs-argo-config
data:
  argo_domain: ""          # 留空使用临时隧道
  cfip: "saas.sin.fan"
  cfport: "443"
  name_prefix: "env0-k8s"
---
apiVersion: v1
kind: Secret
metadata:
  name: nodejs-argo-secrets
type: Opaque
stringData:
  uuid: "9afd1229-b893-40c1-84dd-51e7ce204913"
  argo_auth: ""            # 留空使用临时隧道
